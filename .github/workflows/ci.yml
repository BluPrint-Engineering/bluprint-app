name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DATABASE_URL: postgresql://bluprint:bluprint@localhost:5432/bluprint
  DATABASE_URL_TEST: postgresql://bluprint:bluprint@localhost:5432/bluprint
  # The seed truncates on every run, so E2E reuses the single CI database
  # rather than provisioning another one.
  DATABASE_URL_E2E: postgresql://bluprint:bluprint@localhost:5432/bluprint
  # Throwaway value: CI only needs `envSchema` to accept it so the API boots.
  BETTER_AUTH_SECRET: ci-only-secret-not-used-anywhere-else
  # Self-signup defaults to off (docs/adr/0011-self-signup-is-scaffolding.md), and every
  # auth integration test needs to create an account. Quoted because unquoted
  # YAML hands `z.stringbool()` a real boolean, which it rejects.
  ALLOW_SELF_SIGNUP: "true"

jobs:
  static:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup workspace
        uses: ./.github/actions/setup-workspace

      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bun run typecheck

      - name: Build
        run: bun run build

      - name: Check routeTree.gen.ts is up to date
        run: git diff --exit-code -- apps/web/src/routeTree.gen.ts

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: bluprint
          POSTGRES_PASSWORD: bluprint
          POSTGRES_DB: bluprint
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bluprint -d bluprint"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup workspace
        uses: ./.github/actions/setup-workspace

      - name: Run migrations
        run: bun run --filter @bluprint/api db:migrate

      - name: Test
        run: bun run test

  e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: bluprint
          POSTGRES_PASSWORD: bluprint
          POSTGRES_DB: bluprint
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bluprint -d bluprint"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup workspace
        uses: ./.github/actions/setup-workspace

      - name: Get Playwright version
        id: playwright-version
        run: |
          VERSION=$(grep -m1 -oP '"@playwright/test@\K[0-9.]+(?=")' bun.lock)
          test -n "$VERSION" || { echo "Could not find @playwright/test in bun.lock" >&2; exit 1; }
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ steps.playwright-version.outputs.version }}

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        working-directory: apps/e2e
        run: bunx playwright install --with-deps chromium webkit

      - name: Install Playwright OS dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        working-directory: apps/e2e
        run: bunx playwright install-deps chromium webkit

      - name: E2E
        run: bun run e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            apps/e2e/playwright-report
            apps/e2e/test-results
          retention-days: 14

  ci:
    # A required check that is skipped counts as passing, so without always() a failed needed job would read as green.
    if: always()
    needs: [static, test, e2e]
    runs-on: ubuntu-latest
    steps:
      - name: Require every job to have succeeded
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "needed job results: $RESULTS"
          for result in $RESULTS; do
            test "$result" = "success" || exit 1
          done
