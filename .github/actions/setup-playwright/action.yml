name: Setup Playwright
description: Restore the Playwright browser cache, keyed on the resolved version, and install the browsers on a miss.

inputs:
  os-deps:
    description: Also install the OS packages the browsers need, which the cache does not hold.
    default: "true"

runs:
  using: composite
  steps:
    - name: Get Playwright version
      id: playwright-version
      shell: bash
      run: |
        VERSION=$(grep -m1 -oP '"@playwright/test@\K[0-9.]+(?=")' bun.lock)
        test -n "$VERSION" || { echo "Could not find @playwright/test in bun.lock" >&2; exit 1; }
        echo "version=$VERSION" >> "$GITHUB_OUTPUT"

    - name: Cache Playwright browsers
      id: playwright-cache
      uses: actions/cache@v4
      with:
        path: ~/.cache/ms-playwright
        key: ${{ runner.os }}-playwright-${{ steps.playwright-version.outputs.version }}

    - name: Install Playwright browsers
      if: steps.playwright-cache.outputs.cache-hit != 'true'
      shell: bash
      working-directory: apps/e2e
      run: bunx playwright install ${{ inputs.os-deps == 'true' && '--with-deps' || '' }} chromium webkit

    - name: Install Playwright OS dependencies
      if: steps.playwright-cache.outputs.cache-hit == 'true' && inputs.os-deps == 'true'
      shell: bash
      working-directory: apps/e2e
      run: bunx playwright install-deps chromium webkit
