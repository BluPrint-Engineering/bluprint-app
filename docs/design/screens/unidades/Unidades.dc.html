<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="../../../../.claude/skills/bluprint-design/styles.css">
  <script src="../../../../.claude/skills/bluprint-design/_ds_bundle.js"></script>
  <style>

    a{color:var(--primary)}
    a:hover{color:color-mix(in oklch,var(--primary),#000 15%)}
    .un-back{justify-self:start;display:inline-flex;align-items:center;gap:var(--space-1);min-height:var(--tap-min);padding-right:var(--space-2);margin-left:-6px;font-size:var(--text-sm);font-weight:500;color:var(--muted-foreground);text-decoration:none}
    .un-back:hover{color:var(--foreground)}
    .un-num{font-family:var(--font-mono);font-variant-numeric:tabular-nums}
    .un-neg{color:var(--destructive)}
    .un-figs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr))}
    .un-fig__label{font-size:var(--text-sm);color:var(--muted-foreground)}
    .un-fig__value{font-family:var(--font-mono);font-variant-numeric:tabular-nums;font-weight:600;color:var(--foreground)}
    .un-fig__was{font-size:var(--text-xs);line-height:16px;color:var(--muted-foreground);font-variant-numeric:tabular-nums}

    .un-head{min-height:40px;font-size:var(--text-sm);font-weight:500;color:var(--muted-foreground)}

    .un-row--changed{box-shadow:inset 3px 0 0 var(--primary)}
    .un-row .bp-field{padding-inline:var(--space-4)}
    .un-end{text-align:right;justify-self:end}
    .un-name{display:grid;gap:2px;min-width:0}
    .un-name__text{font-size:var(--text-base);font-weight:500;line-height:var(--leading-snug);overflow-wrap:anywhere}
    .un-meta{font-size:var(--text-sm);color:var(--muted-foreground);font-variant-numeric:tabular-nums}
    .un-cell{font-family:var(--font-mono);font-variant-numeric:tabular-nums;font-size:var(--text-base);font-weight:500}

          <x-import component-from-global-scope="BluPrintDesignSystem_d4fa62.DropdownMenuSeparator" hint-size="100%,9px"></x-import>
          <div style="display:flex; align-items:center; justify-content:space-between; gap:var(--space-3); min-height:var(--tap-min); padding-left:var(--space-3)">

        </div>

    </main>
  </div>

    const dirty = ready && changed.length > 0;
    const over = t.free < 0 ? -t.free : 0;
    const blocked = rows.some(r => r.problem) || over > 0;
    const locked = st.saving;
    const changedText = changed.length + " " + plural(changed.length, "reserva alterada", "reservas alteradas");
    const failAlert = st.saveError && DS.Alert ? h(DS.Alert, { key: "fail", tone: "danger", style: { width: "100%" } }, "Não foi possível salvar as reservas. Confira sua conexão e tente de novo.") : null;
    const discardBtn = (extra) => h(DS.Button, Object.assign({ key: "d", variant: "outline", disabled: locked, onClick: this.discard }, extra), "Descartar");
    const saveBtn = (extra) => h(DS.Button, Object.assign({ key: "s", loading: st.saving, disabled: blocked, onClick: this.save }, extra), st.saving ? "Salvando…" : "Salvar");
    const deliveredLine = t.delivered.count && rows.length ? h("p", { key: "dl", className: "un-line", style: { margin: 0 } }, this.ic("lock", 16),
      t.delivered.count + " " + plural(t.delivered.count, "obra entregue usou", "obras entregues usaram") + " " + fmt(t.delivered.used) + " " + plural(t.delivered.used, "unidade", "unidades") + ".") : null;

    let body = [];
    if (st.phase === "error") {
      body = [this.block("circle-alert", "Não foi possível carregar as unidades", "Confira sua conexão e tente de novo.", () => {
        this.setState({ phase: "loading" });
        clearTimeout(this.t);
        this.t = setTimeout(() => this.setState({ phase: this.isFrozen() ? "error" : "ready" }), 900);
      }, "alert")];
    } else if (DS.Card) {
      if (ready && over > 0) body.push(h(DS.Alert, { key: "over", tone: "danger" }, "As reservas passam das unidades contratadas em " + fmt(over) + ". Baixe alguma reserva ou fale com a BluPrint."));
      body.push(h("div", { key: "figs" }, this.figures(ready ? t : null, desk, !ready)));
      if (!ready) body.push(h("div", { key: "sk" }, this.skeletonList(desk)));
      else if (!rows.length) body.push(h("div", { key: "none" }, this.block("building", "Nenhuma obra em andamento",
        t.delivered.count + " " + plural(t.delivered.count, "obra entregue usou", "obras entregues usaram") + " " + fmt(t.delivered.used) + " unidades.", null, "status")));
      else if (desk) {
        body.push(h(DS.Card, { key: "list", role: "table", "aria-label": "Reservas das obras em andamento", style: { gap: 0, paddingBlock: 0, overflow: "visible" } },
          h("div", { role: "row", className: "un-grid un-head" },
            h("span", { role: "columnheader" }, "Obra"), h("span", { role: "columnheader", className: "un-end" }, "Usadas"),
            h("span", { role: "columnheader", className: "un-end" }, "Reserva"), h("span", { role: "columnheader", className: "un-end" }, "Restam")),
          rows.map(r => this.deskRow(r, locked)),
          dirty ? h(DS.CardFooter, { style: { position: "sticky", bottom: 0, marginBottom: 0, flexWrap: "wrap", justifyContent: "flex-end", background: "color-mix(in srgb, var(--muted) 50%, var(--card))", borderRadius: "0 0 var(--radius-xl) var(--radius-xl)" } },
            failAlert,
            h("span", { className: "un-meta", style: { marginRight: "auto" } }, changedText),
            discardBtn(), saveBtn()) : null));
        if (deliveredLine) body.push(deliveredLine);
      } else {
        body.push(h("div", { key: "cards", style: { display: "grid", gap: "var(--space-3)" } }, rows.map(r => this.mobileCard(r, locked))));
        if (deliveredLine) body.push(deliveredLine);
      }
    }

    const bar = !desk && dirty ? [
      failAlert,
      h("div", { key: "sum", style: { display: "flex", justifyContent: "space-between", alignItems: "baseline", gap: "var(--space-3)", fontSize: "var(--text-sm)" } },
        h("span", { className: "un-meta" }, changedText),
        h("span", { className: "un-meta" }, "Livres ", h("span", { className: "un-cell" + (t.free < 0 ? " un-neg" : ""), style: { fontSize: "var(--text-sm)", color: t.free < 0 ? undefined : "var(--foreground)" } }, signed(t.free)))),
      h("div", { key: "btns", style: { display: "flex", gap: "var(--space-2)" } }, discardBtn({ size: "lg", style: { flex: 1 } }), saveBtn({ size: "lg", style: { flex: 2 } })),
    ] : null;

    return {
      rootRef: this.rootRef, scrollRef: this.scrollRef,
      themeClass: dark ? "dark" : "",
      rootH: framed ? "100%" : "100dvh",
      scrollbarWidth: desk ? "auto" : "none",
      headerPos: desk ? "sticky" : "relative",
      headerH: desk ? "64px" : "56px",
      pad: desk ? "var(--page-pad-desktop)" : "var(--page-pad)",
      mainPad: desk ? "var(--space-8) var(--page-pad-desktop) var(--space-12)" : "var(--space-2) var(--page-pad) var(--space-8)",
      mainGap: "var(--space-5)",
      titleGap: desk ? "var(--space-2)" : "var(--space-1)",
      titleSize: desk ? "var(--text-3xl)" : "var(--text-2xl)",
      logoTone: dark ? "white" : "gradient",
      logoSize: desk ? 32 : 28,
      obrasHref: framed ? "#/projects" : "../obras/Obras.dc.html" + (dark ? "?theme=dark" : ""),
      linkGuard,
      user: USER,
      menuTrigger, menuOpen: st.menuOpen,
      onMenuOpenChange: v => this.setState({ menuOpen: v }),
      themeOptions: DS.Icon ? [
        { value: "light", icon: h(DS.Icon, { name: "sun", size: 18 }), ariaLabel: "Tema claro" },
        { value: "dark", icon: h(DS.Icon, { name: "moon", size: 18 }), ariaLabel: "Tema escuro" },
      ] : [],
      themeValue: dark ? "dark" : "light",
      onTheme: v => this.setState({ dark: v === "dark" }),
      logoutIcon: this.ic("log-out", 20),
      signingOut: st.signingOut,
      signOut: () => {
        if (st.signingOut || framed || this.isFrozen()) return;
        this.setState({ signingOut: true });
        clearTimeout(this.t4);
        this.t4 = setTimeout(() => { window.location.href = "../auth/Entrar.dc.html" + (dark ? "?theme=dark" : ""); }, 1200);
      },
      body,
      bar,
      toast: st.toast,
      toastPos: desk ? "bottom-right" : "bottom-center",
      dismissToast: () => this.setState({ toast: null }),
    };
  }
}
</script>
</body>
</html>
