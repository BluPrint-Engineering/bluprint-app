<script type="text/x-dc" data-dc-script data-props="{&quot;theme&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;light&quot;,&quot;dark&quot;],&quot;default&quot;:&quot;light&quot;,&quot;tsType&quot;:&quot;'light'|'dark'&quot;,&quot;section&quot;:&quot;Demo&quot;},&quot;viewport&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;auto&quot;,&quot;mobile&quot;,&quot;desktop&quot;],&quot;default&quot;:&quot;auto&quot;,&quot;tsType&quot;:&quot;'auto'|'mobile'|'desktop'&quot;,&quot;section&quot;:&quot;Demo&quot;},&quot;role&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;admin&quot;,&quot;manager&quot;,&quot;assistant&quot;],&quot;default&quot;:&quot;manager&quot;,&quot;tsType&quot;:&quot;'admin'|'manager'|'assistant'&quot;,&quot;section&quot;:&quot;Demo&quot;},&quot;structure&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;multi&quot;,&quot;single&quot;,&quot;empty&quot;],&quot;default&quot;:&quot;multi&quot;,&quot;tsType&quot;:&quot;'multi'|'single'|'empty'&quot;,&quot;section&quot;:&quot;Demo&quot;},&quot;screen&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;home&quot;,&quot;tower&quot;,&quot;floor&quot;,&quot;unit&quot;,&quot;area&quot;,&quot;wizard&quot;,&quot;configuration&quot;],&quot;default&quot;:&quot;home&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Demo&quot;},&quot;state&quot;:{&quot;editor&quot;:&quot;string&quot;,&quot;default&quot;:&quot;live&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Demo&quot;},&quot;delivered&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Demo&quot;},&quot;createResult&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;success&quot;,&quot;fail&quot;,&quot;no-units&quot;],&quot;default&quot;:&quot;success&quot;,&quot;tsType&quot;:&quot;'success'|'fail'|'no-units'&quot;,&quot;section&quot;:&quot;Simulação&quot;},&quot;unitsLeft&quot;:{&quot;editor&quot;:&quot;string&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Simulação&quot;},&quot;removeResult&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;success&quot;,&quot;fail&quot;],&quot;default&quot;:&quot;success&quot;,&quot;tsType&quot;:&quot;'success'|'fail'&quot;,&quot;section&quot;:&quot;Simulação&quot;},&quot;framed&quot;:{&quot;editor&quot;:null,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;}}">
const USERS = {
  admin: { name: "Carla Mendes", email: "carla@construtoraatlas.com.br" },
  manager: { name: "Rafael Souza", email: "rafael.souza@construtoraatlas.com.br" },
  assistant: { name: "Paula Rocha", email: "paula.rocha@construtoraatlas.com.br" },
};
const OBRA = "Casa Moinhos";
const TYPES0 = [
  { id: "ta", name: "Tipologia A", rooms: ["Sala", "Cozinha", "Lavanderia", "Dormitório 1", "Dormitório 2", "Banheiro", "Sacada"] },
  { id: "tb", name: "Tipologia B", rooms: ["Sala", "Cozinha", "Lavanderia", "Dormitório", "Banheiro", "Sacada"] },
  { id: "tc", name: "Cobertura", rooms: ["Sala", "Cozinha", "Lavanderia", "Suíte", "Dormitório", "Banheiro", "Lavabo", "Terraço"] },
];
const RESERVED = 400;
const RESERVED_DELIVERED = 380;
const ERR_NET = "Confira sua conexão e tente de novo.";
const DELIVERED_LOCK = "A obra foi entregue: a estrutura não pode mais ser alterada.";
const ordinal = n => n + "º";
const floorName = n => n + "º andar";
const pad2 = n => (n < 10 ? "0" : "") + n;
const letters = "ABCDEFGHIJKLMNOPQRSTUVWXYZ";
const unitName = (floor, i, numbering) => numbering === "letter" ? floor + letters[i] : String(floor) + pad2(i + 1);
const plural = (n, one, many) => n + " " + (n === 1 ? one : many);
const feminine = kind => kind === "tower" || kind === "unit";
const article = kind => feminine(kind) ? "a " : "o ";
const agree = (kind, stem) => stem + (feminine(kind) ? "a" : "o");
const unitsIn = node => node.kind === "unit" ? 1 : node.kind === "floor" ? node.units.length : node.kind === "tower" ? node.floors.reduce((n, f) => n + f.units.length, 0) : 0;
const leftLine = n => n <= 0 ? "A reserva da obra acabou." : n === 1 ? "Resta 1 unidade nesta obra." : "Restam " + n + " unidades nesta obra.";
const sobram = n => (n === 1 ? "sobra" : "sobram") + "\u00A0" + n;
const usesLine = (units, left) => left === 1 ? "Usa 1 da única unidade que resta nesta obra." : "Usa " + units + " das " + left + " unidades que restam nesta obra.";
const planLine = (units, left, verb) => {
  if (left <= 0) return leftLine(left);
  if (units > left || units === 0) return leftLine(left);
  return usesLine(units, left) + " Depois de " + verb + ", " + sobram(left - units) + ".";
};
const duplicateLine = (units, left) => (left === 1 ? "Cria 1 unidade, a única que resta nesta obra." : "Cria " + plural(units, "unidade", "unidades") + " das " + left + " que restam nesta obra.") + " Depois, " + sobram(left - units) + ".";
const NO_UNITS_ASK = "Fale com o admin da construtora.";
function overText(units, left, admin) {
  const head = "Esta estrutura tem " + plural(units, "unidade", "unidades");
  if (left <= 0) return head + " e a reserva da obra acabou. " + (admin ? "Aumente a reserva." : "Peça mais reserva ao admin da construtora.");
  return head + " e a obra tem\u00A0" + left + ". Tire " + plural(units - left, "unidade", "unidades") + " ou " + (admin ? "aumente a reserva." : "peça mais reserva ao admin da construtora.");
}
function duplicateOverText(subject, units, left) {
  return "Duplicar " + subject + " cria " + plural(units, "unidade", "unidades") + (left <= 0 ? " e a reserva da obra acabou." : " e " + (left === 1 ? "resta\u00A01." : "restam\u00A0" + left + "."));
}

let seq = 0;
const nid = p => p + (++seq);

function makeTower(name, { from, to, units, hall, ground, groundAreas, top, towerAreas, typeFor }) {
  const t = { id: nid("t"), kind: "tower", name, floors: [], areas: (towerAreas || []).map(a => ({ id: nid("a"), kind: "area", name: a, rooms: [] })) };
  if (ground) t.floors.push({ id: nid("f"), kind: "floor", name: "Térreo", short: "Térreo", units: [], areas: (groundAreas || ["Hall de entrada"]).map(a => ({ id: nid("a"), kind: "area", name: a, rooms: [] })) });
  for (let f = from; f <= to; f++) {
    const isTop = top && f === to;
    const n = isTop ? top.units : units;
    const fl = { id: nid("f"), kind: "floor", name: floorName(f), short: ordinal(f), num: f, units: [], areas: [] };
    for (let i = 0; i < n; i++) {
      const type = typeFor(f, i, isTop);
      fl.units.push({ id: nid("u"), kind: "unit", name: unitName(f, i), type, extra: [], dropped: [] });
    }
    if (hall) fl.areas.push({ id: nid("a"), kind: "area", name: "Hall", rooms: [] });
    if (isTop && top.areas) top.areas.forEach(a => fl.areas.push({ id: nid("a"), kind: "area", name: a, rooms: [] }));
    t.floors.push(fl);
  }
  return t;
}

function makeData(kind) {
  seq = 0;
  if (kind === "empty") return { towers: [], areas: [], types: [] };
  const ab = (f, i, top) => top ? "tc" : (i % 2 === 0 ? "ta" : "tb");
  if (kind === "single") {
    const t = makeTower("Torre", { from: 1, to: 8, units: 4, hall: true, ground: true, groundAreas: ["Hall de entrada", "Salão de festas"], typeFor: ab });
    return { towers: [t], areas: [{ id: nid("a"), kind: "area", name: "Garagem", rooms: [] }, { id: nid("a"), kind: "area", name: "Fachada", rooms: [] }], types: TYPES0.map(t => ({ ...t, rooms: [...t.rooms] })) };
  }
  const a = makeTower("Torre A", { from: 1, to: 12, units: 4, hall: true, ground: true, top: { units: 4, areas: ["Terraço"] }, towerAreas: ["Salão de festas"], typeFor: ab });
  const b = makeTower("Torre B", { from: 1, to: 10, units: 4, hall: true, ground: true, towerAreas: ["Salão de festas"], typeFor: () => "ta" });
  const salao = a.areas[0];
  salao.rooms = [{ id: nid("r"), name: "Salão" }, { id: nid("r"), name: "Cozinha" }, { id: nid("r"), name: "Banheiro" }];
  const u903 = a.floors.find(f => f.num === 9).units[2];
  u903.extra = ["Escritório"]; u903.dropped = ["Sacada"];
  return {
    towers: [a, b],
    areas: ["Garagem", "Fachada", "Piscina"].map(n => ({ id: nid("a"), kind: "area", name: n, rooms: [] })),
    types: TYPES0.map(t => ({ ...t, rooms: [...t.rooms] })),
  };
}

function index(data) {
  const map = {};
  data.areas.forEach(a => { map[a.id] = { node: a, parent: null, tower: null, floor: null }; });
  data.towers.forEach(t => {
    map[t.id] = { node: t, parent: null, tower: t };
    t.areas.forEach(a => { map[a.id] = { node: a, parent: t, tower: t }; });
    t.floors.forEach(f => {
      map[f.id] = { node: f, parent: t, tower: t, floor: f };
      f.units.forEach(u => { map[u.id] = { node: u, parent: f, tower: t, floor: f }; });
      f.areas.forEach(a => { map[a.id] = { node: a, parent: f, tower: t, floor: f }; });
    });
  });
  return map;
}

function counts(data) {
  let floors = 0, units = 0, areas = data.areas.length;
  data.towers.forEach(t => { areas += t.areas.length; t.floors.forEach(f => { floors++; units += f.units.length; areas += f.areas.length; }); });
  return { towers: data.towers.length, floors, units, areas };
}
const countLine = c => [plural(c.towers, "torre", "torres"), plural(c.floors, "andar", "andares"), plural(c.units, "unidade", "unidades"), plural(c.areas, "área comum", "áreas comuns")].join(" · ");

function wizardDefault(extend) {
  if (extend) return { extend: true, step: 0, count: 1, numbering: "number",

    obraAreas: [], towerAreas: [], floorAreas: [{ tower: 0, floor: "12", name: "Terraço" }],

function validateWizard(w) {
  const errors = {};
  w.towers.slice(0, w.count).forEach((t, i) => {
    const from = parseInt(t.from, 10), to = parseInt(t.to, 10), u = parseInt(t.units, 10);
    if (w.count > 1 && !t.name.trim()) errors["name" + i] = "Informe o nome da torre.";
    if (!t.from.trim()) errors["from" + i] = "Informe o primeiro andar.";
    if (!t.to.trim()) errors["to" + i] = "Informe o último andar.";
    else if (t.from.trim() && !(to >= from)) errors["to" + i] = "O último andar precisa ser igual ou maior que o primeiro.";
    if (!(u >= 1 && u <= 30)) errors["units" + i] = "De 1 a 30 unidades por andar.";
  });
  return errors;
}

function finalsMatch(finals, i) {
  const f = finals.trim().toLowerCase();
  if (!f || f === "todos") return true;
  return f.split(/[ ,]+/).filter(Boolean).map(x => parseInt(x, 10)).includes(i + 1);
}

function previewFrom(w) {
  const towers = [];
  let floors = 0, units = 0, areas = w.obraAreas.length, untyped = 0;
  const typeCount = {};
  w.towers.slice(0, w.count).forEach((t, ti) => {
    const from = parseInt(t.from, 10), to = parseInt(t.to, 10), n = parseInt(t.units, 10);
    const rows = [];
    if (!(to >= from) || !(n >= 1 && n <= 30)) { towers.push({ name: t.name || "Torre", rows, invalid: true }); return; }
    if (t.ground) { rows.push({ label: "Térreo", units: [], areas: ["Hall de entrada"] }); floors++; areas++; }
    for (let f = from; f <= to; f++) {
      const us = [];
      for (let i = 0; i < n; i++) {
        const rule = w.rules.find(r => r.tower === ti && finalsMatch(r.finals, i) && f >= parseInt(r.from, 10) && f <= parseInt(r.to, 10));
        const type = rule ? rule.type : null;
        if (type) typeCount[type] = (typeCount[type] || 0) + 1; else untyped++;
        us.push({ name: unitName(f, i, w.numbering), type });
      }
      const fa = [];
      if (t.hall) fa.push("Hall");
      w.floorAreas.filter(a => a.tower === ti && parseInt(a.floor, 10) === f).forEach(a => fa.push(a.name));
      rows.push({ label: ordinal(f), units: us, areas: fa, isNew: w.extend });
      floors++; units += n; areas += fa.length;
    }
    areas += w.towerAreas.length;
    towers.push({ name: w.count > 1 || w.extend ? t.name : "Torre única", rows: rows.reverse() });
  });
  return { towers, floors, units, areas, untyped, typeCount, count: w.extend ? 0 : w.count };
}
