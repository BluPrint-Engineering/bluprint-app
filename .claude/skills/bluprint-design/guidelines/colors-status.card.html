<!-- @dsCard group="Colors" viewport="700x170" name="Domain — unit status" subtitle="Paints the unit cell on the dashboard. Never a UI color." -->
<link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:18px 20px;background:var(--background);color:var(--foreground);font-family:var(--font-sans)}.row{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end}.sw{display:flex;flex-direction:column;gap:6px}.chip{height:52px;border-radius:var(--radius-lg);box-shadow:var(--ring-hairline)}.lbl{font-size:11px;color:var(--muted-foreground);font-variant-numeric:tabular-nums}.nm{font-size:12px;font-weight:500}</style><div class="row" style="gap:10px">
<div class="sw" style="width:126px"><div class="chip" style="background:var(--status-checklist-fill);border:2px dashed var(--status-checklist-border);box-shadow:none"></div><div class="nm">Em checklist</div><div class="lbl">no fill · #CBD5E1</div></div>
<div class="sw" style="width:126px"><div class="chip" style="background:var(--status-released);"></div><div class="nm">Liberado</div><div class="lbl">--status-released</div></div><div class="sw" style="width:126px"><div class="chip" style="background:var(--status-in-progress);"></div><div class="nm">Em execução</div><div class="lbl">--status-in-progress</div></div><div class="sw" style="width:126px"><div class="chip" style="background:var(--status-recheck);"></div><div class="nm">Reconferência</div><div class="lbl">--status-recheck</div></div><div class="sw" style="width:126px"><div class="chip" style="background:var(--status-done);"></div><div class="nm">Concluída</div><div class="lbl">--status-done</div></div></div>
<div class="lbl" style="margin-top:10px">RNF-07 — a cell always carries its label or icon too; color alone never says the status.</div>
