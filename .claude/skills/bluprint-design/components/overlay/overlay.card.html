<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<div id="root"></div>
<script type="text/babel">
const NS = window.BluPrintDesignSystem_d4fa62;
const I = n => <NS.Icon name={n} size={20} />;
function Demo(){const {DropdownMenu,DropdownMenuItem,DropdownMenuLabel,DropdownMenuSeparator,Sheet,Button,Avatar,SegmentedControl}=NS;
const [t,setT]=React.useState('light');
return <div style={{display:'flex',gap:28,alignItems:'flex-start'}}>
  <div style={{width:300,height:340}}>
    <div className="cap">dropdown menu — user menu</div>
    <DropdownMenu defaultOpen align="start" label="Conta" trigger={<Button variant="ghost" aria-label="Abrir menu da conta" style={{padding:'0 6px'}}><Avatar name="Guilherme Lopes" /></Button>}>
      <DropdownMenuLabel><strong style={{fontWeight:600}}>Guilherme Lopes</strong><span style={{fontSize:'var(--text-sm)',color:'var(--muted-foreground)'}}>gui@melnick.com.br</span></DropdownMenuLabel>
      <DropdownMenuSeparator />
      <div className="bp-menu__row"><span>Tema</span><SegmentedControl size="sm" value={t} onChange={setT} label="Tema" options={[{value:'light',icon:I('sun'),ariaLabel:'Tema claro'},{value:'dark',icon:I('moon'),ariaLabel:'Tema escuro'}]} /></div>
      <DropdownMenuSeparator />
      <DropdownMenuItem icon={I('log-out')} keepOpen>Sair</DropdownMenuItem>
    </DropdownMenu>
  </div>
  <div>
    <div className="cap">sheet — mobile, contained here</div>
    <div style={{position:'relative',width:300,height:340,overflow:'hidden',borderRadius:14,boxShadow:'var(--ring-hairline)'}}>
      <Sheet open contained onClose={()=>{}} title="Filtros" description="1 filtro ativo"
        footer={<><Button variant="outline" size="lg">Limpar</Button><Button size="lg" block>Mostrar 12 obras</Button></>}>
        <div style={{display:'grid',gap:8}}><span className="bp-label">Status</span><SegmentedControl block value="in_progress" options={[{value:'in_progress',label:'Em andamento'},{value:'delivered',label:'Entregue'},{value:'all',label:'Todas'}]} /></div>
      </Sheet>
    </div>
  </div>
</div>}
ReactDOM.createRoot(document.getElementById('root')).render(<Demo />);
</script>
