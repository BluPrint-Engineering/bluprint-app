<!-- @dsCard group="Web app" viewport="1100x800" name="Estados de carregamento" subtitle="Session check, Entrar and Criar conta frozen mid-request, web and mobile, both themes" -->
<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><title>BluPrint — estados de carregamento</title>
<link rel="stylesheet" href="../../styles.css">
<style>
body{margin:0;padding:22px;background:var(--muted);color:var(--foreground);font-family:var(--font-sans)}
.head{display:flex;align-items:baseline;gap:14px;margin-bottom:16px}
h1{font-size:var(--text-lg);font-weight:600;margin:0}
.head p{margin:0;font-size:var(--text-sm);color:var(--muted-foreground)}
.head button{margin-left:auto;height:34px;padding:0 14px;border:1px solid var(--border);border-radius:var(--radius-lg);background:var(--card);color:var(--foreground);font:500 13px var(--font-sans);cursor:pointer}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}
.cell{display:grid;gap:8px;justify-items:center}
.t{font-size:var(--text-sm);font-weight:500;text-align:center}
.t small{display:block;font-weight:400;color:var(--muted-foreground);font-size:var(--text-xs)}
.web{width:100%;aspect-ratio:1280/800;border-radius:var(--radius-lg);overflow:hidden;box-shadow:var(--ring-hairline);background:var(--background)}
.web iframe{width:1280px;height:800px;border:0;transform-origin:top left;display:block}
.ph{width:201px;height:352px;overflow:hidden;border-radius:22px;box-shadow:var(--shadow-md);background:var(--background)}
.ph iframe{width:402px;height:704px;border:0;transform:scale(.5);transform-origin:top left;display:block}
.sec{font-size:var(--text-xs);letter-spacing:var(--tracking-wide);text-transform:uppercase;color:var(--muted-foreground);margin:22px 0 10px}
</style></head><body>
<div class="head"><h1>Estados de carregamento</h1><p>Congelados no meio da requisição — issues #42 e #43</p><button id="tg">Alternar tema</button></div>
<div class="sec">Web · 1280 × 800</div>
<div class="grid" id="web"></div>
<div class="sec">Celular · 402 pt</div>
<div class="grid" id="mob"></div>
<script>
const STATES=[["session","Verificação de sessão","antes de qualquer pintura, sem flash de conteúdo"],["login","Entrar","botão ocupado, rótulo em “Entrando…”"],["signup","Criar conta","botão em “Criando conta…”"]];
let theme="light";
function render(){
  document.getElementById("web").innerHTML=STATES.map(([s,n,d])=>
    `<div class="cell"><div class="web"><iframe src="state.html?state=${s}&theme=${theme}" title="${n} web"></iframe></div><div class="t">${n}<small>${d}</small></div></div>`).join("");
  document.getElementById("mob").innerHTML=STATES.map(([s,n])=>
    `<div class="cell"><div class="ph"><iframe src="state.html?state=${s}&theme=${theme}" title="${n} celular"></iframe></div><div class="t">${n}</div></div>`).join("");
  document.querySelectorAll(".web").forEach(w=>{const f=w.querySelector("iframe");const fit=()=>f.style.transform="scale("+(w.clientWidth/1280)+")";fit();new ResizeObserver(fit).observe(w)});
}
document.getElementById("tg").onclick=()=>{theme=theme==="light"?"dark":"light";document.documentElement.classList.toggle("dark",theme==="dark");document.body.classList.toggle("dark",theme==="dark");render()};
render();
</script></body></html>
