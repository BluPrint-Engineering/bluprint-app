<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">

<style>
/* Mobile first: gradient band with the stacked mark, then the form flat on the page.
   The band carries the theme toggle inside it, below the browser's safe area. */
body{background:var(--background)}
.auth{position:relative;min-height:100dvh;display:flex;flex-direction:column}
.auth__brand{background:var(--brand-band-bleed),var(--brand-band);border-radius:var(--brand-band-radius);color:#fff;padding:0 var(--page-pad) var(--brand-band-pad);display:grid;justify-items:center;gap:var(--space-3)}
.auth__bar{width:100%;display:flex;justify-content:flex-end;align-items:center;padding-top:max(var(--space-1),env(safe-area-inset-top));min-height:48px;color:rgb(255 255 255 / .9)}
.auth__lockup{width:auto;display:block}
.auth__badge{display:grid;grid-template-areas:"m";place-items:center;width:72px;height:72px;border-radius:var(--radius-full);background:var(--brand-badge-surface);box-shadow:var(--brand-badge-shadow);transition:background var(--duration) var(--ease-out),box-shadow var(--duration) var(--ease-out)}
.auth__badge-mark{grid-area:1/1;height:44px;width:auto;display:block}
.auth__badge-mark--dark{display:none}
.dark .auth__badge-mark--light{display:none}
.dark .auth__badge-mark--dark{display:block}
.auth__lockup--stacked{height:36px}
.auth__lockup--row{display:none}
.auth__tagline{display:none}
.auth__main{flex:1;display:grid;place-items:start center;padding:var(--space-6) var(--page-pad) var(--space-10)}
.auth__slot{width:100%;max-width:var(--content-max)}
/* On a phone the card frame only adds noise — the form sits straight on the page */
.auth__slot .bp-card{background:transparent;box-shadow:none;border-radius:0;padding-block:0;gap:var(--space-5)}
.auth__slot .bp-card__header,.auth__slot .bp-card__content{padding-inline:0}
.auth__slot .bp-card__footer{background:transparent;border:0;justify-content:center;padding:var(--space-2) 0 0;margin:0}
@media (min-width:900px){
  .auth{flex-direction:row;align-items:stretch}
  .auth__brand{background:var(--brand-band);border-radius:0;flex:0 0 44%;padding:var(--space-12) var(--space-10);justify-items:start;align-content:space-between;gap:var(--space-6)}
  .auth__bar{position:absolute;top:10px;right:10px;z-index:3;width:auto;min-height:0;padding:0;color:var(--muted-foreground)}
  .auth__badge{display:none}
  .auth__lockup--stacked{display:none}
  .auth__lockup--row{display:block;height:54px;align-self:center}
  .auth__tagline{display:block;color:rgb(255 255 255 / .92);font-size:var(--text-base);line-height:var(--leading-normal);max-width:34ch}
  .auth__main{flex:1;place-items:center;padding:var(--page-pad-desktop);position:relative}
  .auth__slot{max-width:26rem}
  .auth__slot .bp-card{background:var(--card);box-shadow:var(--ring-hairline);border-radius:var(--radius-xl);padding-block:var(--card-spacing);gap:var(--card-spacing)}
  .auth__slot .bp-card__header,.auth__slot .bp-card__content{padding-inline:var(--card-spacing)}
  .auth__slot .bp-card__footer{background:color-mix(in srgb,var(--muted) 50%,transparent);border-top:1px solid var(--border);padding:var(--card-spacing);margin-bottom:calc(var(--card-spacing) * -1)}
}
</style></head><body><div id="root"></div>

<script type="text/babel" data-presets="react">
// Pin the theme for this preview only. window.__bpThemeOverride stops AuthShell's toggle from
// reading — or writing — the shared "bp-theme" key that the real screens use.
const wantDark = new URLSearchParams(location.search).get("theme") === "dark";
window.__bpThemeOverride = wantDark ? "dark" : "light";
document.documentElement.classList.toggle("dark", wantDark);
document.body.classList.toggle("dark", wantDark);
const state = new URLSearchParams(location.search).get("state") || "session";
const { AuthShell, LoginScreen, SignupScreen, App } = window;

function Frozen() {
  if (state === "session") return <App start="session-hold" />;
  return (
    <AuthShell>
      {state === "signup"
        ? <SignupScreen invite={INVITE_L} forceLoading onLogin={() => {}} onDone={() => {}} />
        : <LoginScreen forceLoading onDone={() => {}} />}
    </AuthShell>
