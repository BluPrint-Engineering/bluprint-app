services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      # Must match DATABASE_URL in .env — dotenv there doesn't expand ${VAR}.
      POSTGRES_USER: ${POSTGRES_USER:-bluprint}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bluprint}
      POSTGRES_DB: ${POSTGRES_DB:-bluprint}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./docker/postgres/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro
    healthcheck:
      # $$ escapes Compose's own interpolation; the container's shell expands it.
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 2s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
