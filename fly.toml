# No secrets here: the repository is public. They come from `fly secrets set` (ADR 0059).
app = "bluprint-api"
primary_region = "gru"

[deploy]
  release_command = "node dist/db/migrate"

[env]
  NODE_ENV = "production"
  ALLOW_SELF_SIGNUP = "false"
  PORT = "3000"

[http_service]
  internal_port = 3000
  force_https = true
  # Scale to zero, a temporary exception (ADR 0016); always-on is `min_machines_running = 1`
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    method = "GET"
    path = "/api/health"
    grace_period = "10s"
    interval = "30s"
    timeout = "5s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"

[[restart]]
  policy = "on-failure"
  retries = 10
